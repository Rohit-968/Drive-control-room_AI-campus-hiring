<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drive control room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
:root{--bg:#E6E9ED;--surface:#F4F6F8;--raise:#FFFFFF;--ink:#17202A;--muted:#566170;--rule:#C9D0D8;--cord:#A9B3BF;--blue:#2357B5;--blue-soft:#DCE5F6;--amber:#C08A0C;--amber-ink:#7A5300;--amber-soft:#F6EACB;--green:#1E7A49;--green-soft:#D6ECDE;--red:#B3372B;--red-soft:#F5DCD8;--on:#FFFFFF;--scrim:rgba(15,20,26,.45);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141A;--surface:#161D25;--raise:#1C252F;--ink:#E3E8ED;--muted:#9AA5B1;--rule:#2C3641;--cord:#4C5968;--blue:#7DA4EE;--blue-soft:#1B2A45;--amber:#E2B23F;--amber-ink:#F0CA6E;--amber-soft:#3A2F16;--green:#5AB887;--green-soft:#15301F;--red:#E6766A;--red-soft:#3B1F1C;--on:#0F141A;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F141A;--surface:#161D25;--raise:#1C252F;--ink:#E3E8ED;--muted:#9AA5B1;--rule:#2C3641;--cord:#4C5968;--blue:#7DA4EE;--blue-soft:#1B2A45;--amber:#E2B23F;--amber-ink:#F0CA6E;--amber-soft:#3A2F16;--green:#5AB887;--green-soft:#15301F;--red:#E6766A;--red-soft:#3B1F1C;--on:#0F141A;--scrim:rgba(0,0,0,.6);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Archivo","Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding-left:20px;padding-right:20px}
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;padding-top:22px;padding-bottom:16px}
h1{font-stretch:75%;font-weight:760;font-size:32px;line-height:1.05;margin:0;letter-spacing:-.01em}
h2{font-stretch:85%;font-weight:720;font-size:24px;line-height:1.15;margin:0 0 8px}
h3{font-size:15px;font-weight:650;margin:22px 0 8px}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:70ch}
.acts,.row-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row-acts{margin-top:14px}
.btn{font:inherit;font-size:14px;font-weight:600;min-height:40px;padding:8px 14px;border-radius:6px;border:1px solid var(--rule);background:var(--raise);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.55;cursor:progress}
.mini{font:inherit;font-size:12px;font-weight:600;padding:3px 8px;border-radius:5px;border:1px solid var(--rule);background:var(--raise);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,#file:focus-visible+label{outline:2px solid var(--blue);outline-offset:2px}
.flow{background:var(--surface);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.flow .wrap{padding-top:18px;padding-bottom:14px}
.scroller{overflow-x:auto}
.track{min-width:720px}
.stages{display:grid;grid-template-columns:repeat(6,1fr)}
.stage{padding:0 6px;text-align:center}
.stage .n{font-stretch:62%;font-weight:800;font-size:clamp(40px,5.2vw,62px);line-height:1}
.stage .l{font-weight:650;font-size:14px;margin-top:6px}
.stage .d{font-size:12.5px;color:var(--muted);min-height:1.5em}
#band{display:block;width:100%;height:56px;margin-top:8px}
#band.pre{opacity:.45}
#band path{stroke-width:1;vector-effect:non-scaling-stroke}
.b-cord{fill:var(--cord);stroke:var(--cord)}.b-blue{fill:var(--blue);stroke:var(--blue)}.b-green{fill:var(--green);stroke:var(--green)}
.summary{margin:10px 0 0;font-size:14px;color:var(--muted);max-width:90ch}
.steps{display:flex;gap:2px;margin-top:14px;border-bottom:1px solid var(--rule);overflow-x:auto}
.steps button{font:inherit;font-weight:650;font-size:15px;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.steps button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.steps button[disabled]{cursor:not-allowed;opacity:.5}
.steps .k{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font-size:12px;margin-right:7px}
#view{padding-top:22px;padding-bottom:64px}
.lead{max-width:66ch;margin:0 0 14px;font-size:16px}
.hint{color:var(--muted);font-size:13px;margin:6px 0}
.note{background:var(--blue-soft);border-left:3px solid var(--blue);padding:8px 10px;font-size:14px;border-radius:0 6px 6px 0}
.warn{background:var(--red-soft);color:var(--red);padding:8px 10px;border-radius:6px;font-size:14px}
.intro{margin-bottom:18px}
.next{margin-top:28px;padding-top:16px;border-top:1px solid var(--rule)}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--raise)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:650;color:var(--muted);font-size:13px;background:var(--surface);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.r{text-align:right}
.raw td{white-space:pre;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.was{display:block;color:var(--muted);font-size:12px;white-space:pre;text-decoration-color:var(--red)}
.cols{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.6fr);gap:22px;align-items:start;margin-top:14px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:start}
.screen{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.notify{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:920px){.screen{grid-template-columns:1fr}}
@media (max-width:860px){.cols,.cols2,.notify{grid-template-columns:1fr}}
.ctrl{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px}
.ctrl h3:first-child{margin-top:0}
.rng{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:8px 0;font-size:14px}
.rng input{grid-column:1/-1;width:100%;accent-color:var(--blue)}
.rng output{font-weight:700}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:14px}
.chk input{accent-color:var(--blue);width:18px;height:18px;margin:0}
.cap{font-size:14px;margin:4px 0 8px}
.cap.over{color:var(--amber-ink);font-weight:650}
.req{font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;border:1.5px solid var(--rule);background:var(--raise);color:var(--ink);cursor:pointer;margin:0 6px 6px 0}
.req small{margin-left:6px;font-size:11px;opacity:.8}
.req.must{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:650}
.req.nice{border-style:dashed;border-color:var(--blue);color:var(--blue)}
.req.off{color:var(--muted);text-decoration:line-through}
.chip{display:inline-flex;align-items:center;font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--surface);border:1px solid transparent;white-space:nowrap;margin:0 4px 4px 0}
.s-short{background:var(--blue-soft);color:var(--blue)}
.s-review{background:var(--amber-soft);color:var(--amber-ink)}
.s-no{color:var(--muted);border-color:var(--rule)}
.s-out{background:var(--red-soft);color:var(--red)}
.s-ok{background:var(--green-soft);color:var(--green)}
.ai{display:block;font-size:12px;color:var(--amber-ink)}
.filters,.groups{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.f{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--rule);background:var(--raise);color:var(--ink);cursor:pointer}
.f[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.who{font:inherit;font-weight:650;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.rank small{display:block;color:var(--muted);font-size:12px}
.bar{height:6px;background:var(--surface);border-radius:3px;overflow:hidden;margin-top:4px;min-width:70px}
.bar i{display:block;height:100%;background:var(--blue)}
.big{font-stretch:62%;font-weight:800;line-height:1}
.clock{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.clock .big{font-size:58px}
.clock input{flex:1;min-width:220px;accent-color:var(--blue)}
.counts{display:flex;flex-wrap:wrap;gap:22px;margin:12px 0 16px}
.counts dt{font-size:13px;color:var(--muted)}
.counts dd{margin:0;font-stretch:75%;font-weight:760;font-size:26px;line-height:1.1}
.grid{display:grid;grid-template-columns:150px repeat(4,minmax(92px,1fr)) 26px repeat(3,minmax(92px,1fr));min-width:880px}
.grid>div{border-bottom:1px solid var(--rule);padding:6px}
.gh{font-size:13px;font-weight:650;color:var(--muted);background:var(--surface)}
.lunch{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--rule) 6px 7px)}
.pan{font-weight:650;font-size:14px}
.pan small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-bottom:4px}
.cell{width:100%;min-height:52px;font:inherit;font-size:13px;text-align:left;border:1px solid var(--rule);border-radius:6px;background:var(--raise);color:var(--ink);padding:5px 7px;cursor:pointer;line-height:1.3;display:block}
.cell .tag{display:block;font-size:11.5px;color:var(--muted)}
.cell.done{background:var(--green-soft);border-color:transparent}
.cell.live{border:2px solid var(--blue);background:var(--blue-soft)}
.cell.noshow{background:var(--red-soft);border-color:transparent;color:var(--red)}
.cell.empty,.cell.gone{border-style:dashed;background:transparent;color:var(--muted);cursor:default}
.cell.gone{border-color:var(--red)}
.cell.mv .tag{color:var(--amber-ink);font-weight:650}
.cell.sel{outline:3px solid var(--ink);outline-offset:1px}
.slotbar{margin:12px 0;padding:10px 12px;border-left:3px solid var(--blue);background:var(--surface);display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:52px}
.log{list-style:none;padding:0;margin:0}
.log li{padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.log time{font-weight:700;margin-right:8px}
.mail{background:var(--raise);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--surface);font-size:14px}
.pager{display:inline-flex;gap:8px;align-items:center}
.subj{padding:14px 14px 0;font-weight:700;font-size:16px}
.body{padding:10px 14px 16px;white-space:pre-wrap;font:inherit;margin:0;line-height:1.6;max-width:72ch}
.tpl h3{margin-top:0}
.tpl input[type=text],.tpl textarea{display:block;width:100%;font:inherit;font-size:14px;padding:8px 10px;border-radius:6px;border:1px solid var(--rule);background:var(--raise);color:var(--ink);margin:2px 0 10px}
.tpl textarea{min-height:230px;resize:vertical;line-height:1.5}
textarea:focus-visible,.tpl input:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.tpl pre{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px;margin:0 0 10px}
.tpl mark{background:var(--blue-soft);color:var(--blue);border-radius:3px;padding:0 2px}
.airow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{font:inherit;font-size:14px;min-height:40px;padding:6px 10px;border-radius:6px;border:1px solid var(--rule);background:var(--raise);color:var(--ink)}
.brief-text{font-size:17px;line-height:1.55;max-width:68ch;border-left:3px solid var(--green);padding:2px 0 2px 16px}
.brief-text p{margin:0 0 8px}
.decisions{padding-left:22px;margin:0;max-width:72ch}
.decisions li{margin:6px 0}
.bars .row{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.track2{height:12px;background:var(--surface);border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--blue)}
.fill.low{background:var(--amber)}
@media (max-width:560px){.bars .row{grid-template-columns:110px 1fr 76px}.clock .big{font-size:46px}h1{font-size:28px}}
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
#sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--raise);border-left:1px solid var(--rule);z-index:21;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-score{display:flex;align-items:center;gap:10px;margin:12px 0}
.sh-score .big{font-size:44px}
.prow{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.prow .bar{margin:0}
.plain,.focus{padding-left:20px;margin:0}
.plain li,.focus li{font-size:14px;margin:4px 0}
.sh-acts{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap}
#toastWrap{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:30}
#toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:560px;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top wrap">
<div><h1>Drive control room</h1><p class="sub" id="sub"></p></div>
<div class="acts"><button class="btn primary" id="run" data-act="run">Run the drive</button><input type="file" id="file" class="vh" accept=".csv,text/csv"><label class="btn ghost" for="file">Load your CSV</label></div>
</header>
<section class="flow" aria-label="Drive pipeline"><div class="wrap"><div class="scroller"><div class="track"><div class="stages" id="stages"></div><svg id="band" viewBox="0 0 1200 80" preserveAspectRatio="none" aria-hidden="true"></svg></div></div><p class="summary" id="summary"></p></div></section>
<nav class="steps wrap" id="steps" role="tablist" aria-label="Drive steps"></nav>
<main class="wrap" id="view" role="tabpanel"></main>
<div id="scrim" hidden></div>
<aside id="sheet" hidden aria-label="Candidate details"></aside>
<div id="toastWrap"><div id="toast" role="status" aria-live="polite"></div></div>

<div class="notify"><div id="mw">${G[S.mg].length?mailHTML(G):''}</div><div class="tpl">${tplHTML(G)}</div></div>${S.dl?'<div class="row-acts"><button class="btn" data-act="xmail">Export mail merge (CSV)</button></div>':''}${nextBtn('report','See the founder report')}`}
function vReport(){const f=facts(),d=decisions(f),mx=f.cs.length?f.cs[0].r||1:1;
const plain=`<div class="brief-text"><p>${f.applied} applications came in for the Software Engineer drive from ${f.campuses} campuses. After merging ${f.dup} duplicates, ${f.unique} candidates remain; ${f.took} took the online test and ${f.eligible} met the eligibility criteria.</p><p>${f.shortlisted} are shortlisted and ${f.booked} interviews are booked for Thursday${f.standby?', with '+f.standby+' on standby for Friday':''}.${f.review?' '+pl(f.review,'borderline candidate')+' still '+(f.review===1?'needs':'need')+' a decision.':''}</p></div>`;
const brief=S.briefAI!=null&&!S.showPlain?`<div class="brief-text" id="briefAI">${esc(S.briefAI)||'Thinking…'}</div><p class="hint">Claude's draft, written only from the numbers on this page. <button class="mini" data-act="plain">Show the plain version</button></p>`:plain+(S.sample?`<div class="row-acts"><button class="btn" data-act="brief"${S.busy==='brief'?' disabled':''}>Rewrite for the founders with Claude</button></div>`:'');
return `<div class="cols2"><div><h2>Founder brief</h2>${brief}<h3>Decisions needed</h3>${d.length?`<ol class="decisions">${d.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p class="hint">Nothing needs a decision right now.</p>'}</div>
<div><h2>Shortlist rate by campus</h2><p class="hint">Campuses with five or more candidates. Amber bars sit below the overall rate of ${Math.round(f.overall*100)}%.</p><div class="bars">${f.cs.map(x=>`<div class="row"><span>${esc(x.k)}</span><div class="track2"><div class="fill${x.r<f.overall?' low':''}" style="width:${x.r/mx*100}%"></div></div><span class="r">${x.s} of ${x.a}</span></div>`).join('')||'<p class="hint">Not enough candidates per campus yet.</p>'}</div>
<dl class="counts">${[[f.unique,'candidates'],[f.shortlisted,'shortlisted'],[f.booked,'booked'],[f.emails,'emails drafted']].map(x=>`<div><dd>${x[0]}</dd><dt>${x[1]}</dt></div>`).join('')}</dl>${S.dl?'<div class="row-acts"><button class="btn" data-act="xtrack">Export candidate tracker (CSV)</button></div>':''}</div></div>`}
const V={clean:vClean,screen:vScreen,schedule:vSchedule,notify:vNotify,report:vReport};
function render(){const k=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.key;renderHero();renderTabs();$('#view').innerHTML=V[S.tab]();if(S.open)$('#sheet').innerHTML=sheetHTML(BY.get(S.open));if(k){const e=document.querySelector(`[data-key="${k}"]`);if(e&&!e.disabled)e.focus()}}
function animate(to){const els=[...document.querySelectorAll('#stages .n')],from=to.map(()=>to[0]);if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const t0=performance.now(),step=now=>{const t=now-t0,cur=to.map((v,i)=>{const p=clamp((t-i*120)/520,0,1);return Math.round(from[i]+(v-from[i])*(1-Math.pow(1-p,3)))});cur.forEach((v,i)=>els[i].textContent=v);band(cur);if(t<1120)requestAnimationFrame(step);else{to.forEach((v,i)=>els[i].textContent=v);band(to)}};requestAnimationFrame(step)}
function load(text,src){const tab=parseCSV(text.replace(/^\uFEFF/,''));if(tab.length<2){toast('That file has no data rows. Use a CSV with a header row.');return false}const m=mapCols(tab[0]);if(m.name==null&&m.email==null){toast("Couldn't find a name or email column. Add a header row with Name and Email.");return false}S.tab0=tab;S.map=m;S.src=src;S.ran=false;S.tab='clean';S.filter='all';S.all=false;closeSheet();return true}
function doRun(){const t0=performance.now();S.D=clean(S.tab0,S.map);BY=new Map(S.D.rows.map(c=>[c.id,c]));S.ov={};S.ai={};S.briefAI=null;S.showPlain=false;screen();plan();S.ms=Math.max(1,Math.round(performance.now()-t0));S.ran=true;S.tab='clean';S.mg='invite';S.mi=0;render();animate(counts())}
function recompute(){screen();plan();renderHero();if(S.tab==='screen')$('#res').innerHTML=resHTML()}
function openSheet(id,b){S.open=id;S.opener=b;$('#sheet').innerHTML=sheetHTML(BY.get(id));$('#sheet').hidden=false;$('#scrim').hidden=false;$('#sheet [data-act="close"]').focus()}
function closeSheet(){if(!S.open)return;S.open=null;$('#sheet').hidden=true;$('#scrim').hidden=true;if(S.opener&&document.contains(S.opener))S.opener.focus()}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),4200)}
const DEAD=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];
function aiErr(e){const c=e&&e.code;if(c==='cancelled')return;if(DEAD.includes(c)){S.sample=null;toast("Claude isn't available in this view, so those buttons are hidden.");return}toast(c==='rate_limited'?'Claude is busy right now. Try again in a minute.':c==='invalid_json'?"Claude's answer came back in the wrong shape. Try again.":c==='refused'?"Claude didn't answer that one.":"Claude couldn't finish. Try again.")}
async function deep(){const q=S.D.rows.filter(c=>c.st==='review').sort(byScore).slice(0,12);if(!q.length)return;S.busy='deep';$('#res').innerHTML=resHTML();
const lv=x=>S.req.filter(r=>r.lv===x).map(r=>r.label).join(', ')||'none';
const prompt=`You are helping a campus recruiter at a cloud communications company decide on borderline candidates for a Software Engineer (campus 2027) role.\n\nMust-have skills: ${lv('must')}\nNice-to-have skills: ${lv('nice')}\nShortlist cutoff: ${S.cut} out of 100. The score mixes online test, skills match, CGPA and projects.\n\nJudge only the job-relevant evidence below. Names, campuses and contact details are deliberately left out; do not guess them.\n\nFor each candidate return {"id": string, "lean": "shortlist" | "hold" | "pass", "why": one plain sentence under 22 words, "ask": one interview question that would settle the doubt}. Reply with only a JSON array, one object per candidate, in the same order.\n\nCandidates:\n`+JSON.stringify(q.map(c=>({id:c.id,score:c.score,flag:c.flag,test:c.test,cgpa:c.cgpa,backlogs:c.backlogs,skills:c.skills,missing_must_haves:c.mustMiss,projects:c.projects,internship:c.intern})));
try{const r=await S.sample.json(prompt,{modelTier:'quick'});let n=0;if(Array.isArray(r))for(const o of r)if(o&&BY.has(String(o.id))&&LEAN[o.lean]){S.ai[String(o.id)]={lean:o.lean,why:String(o.why||''),ask:String(o.ask||'')};n++}toast(n?'Claude gave a second read on '+pl(n,'candidate')+'. You still make the call.':"Claude's answer didn't match these candidates. Try again.")}catch(e){aiErr(e)}
S.busy='';render()}
async function rewrite(){const k=S.mg,t=S.tpl[k],tone=$('#tone').value;S.busy='tpl';render();
const prompt=`Rewrite this recruiting email so it reads ${TONE[tone][1]}. Keep every placeholder in curly braces exactly as written, such as {first} and {time}, and keep every fact. Under 130 words. Sign off as Plivo Talent Team. Reply with only JSON: {"subject": string, "body": string}.\n\nSubject: ${t.subject}\n\nBody:\n${t.body}`;
try{const r=await S.sample.json(prompt,{modelTier:'quick',cache:false}),need=(t.subject+t.body).match(/\{\w+\}/g)||[],got=String((r&&r.subject||'')+(r&&r.body||''));if(!r||!r.subject||!r.body||need.some(x=>!got.includes(x)))toast("Claude's rewrite dropped a merge field, so the template wasn't changed.");else{S.tpl[k]={subject:String(r.subject),body:String(r.body)};toast('Template rewritten. Every email in this group now uses it.')}}catch(e){aiErr(e)}
S.busy='';render()}
async function aiBrief(){const f=facts();S.busy='brief';S.briefAI='';S.showPlain=false;render();
const prompt=`Write a short update for the founders of a 100-person tech company about today's campus hiring drive for Software Engineers. Plain text only: 3 to 4 sentences, no greeting, no headings, no bullet points, no sign-off. Lead with what needs their decision. Use only these facts:\n`+JSON.stringify({...f,cs:f.cs.map(x=>({campus:x.k,candidates:x.a,shortlisted:x.s})),decisions:decisions(f)});
try{const r=await S.sample(prompt,{modelTier:'quick',cache:false,onText:({text})=>{S.briefAI=text;const e=$('#briefAI');if(e)e.textContent=text}});S.briefAI=r.text}catch(e){S.briefAI=e&&e.text?e.text:null;aiErr(e)}
S.busy='';if(S.tab==='report')render()}
async function save(name,rows){if(!S.dl)return;try{await S.dl.save({filename:name,data:toCSV(rows)});toast('Saved '+name+'.')}catch(e){const c=e&&e.code;if(c==='declined')return;if(['unavailable','not_granted','capability_disabled','capability_removed'].includes(c)){S.dl=null;render()}toast("Couldn't save the file here.")}}
const ACT={run:doRun,tab:v=>{S.tab=v;render();$('#steps').scrollIntoView({block:'start'})},
req:v=>{const r=S.req[+v];r.lv=r.lv==='must'?'nice':r.lv==='nice'?'off':'must';recompute();$('#ctrl').innerHTML=ctrlHTML();$(`[data-key="req${v}"]`).focus()},
filter:v=>{S.filter=v;S.all=false;$('#res').innerHTML=resHTML();$(`[data-key="f${v}"]`).focus()},all:()=>{S.all=true;$('#res').innerHTML=resHTML()},
open:(v,b)=>openSheet(v,b),close:closeSheet,
ov:v=>{if(v)S.ov[S.open]=v;else delete S.ov[S.open];recompute();$('#sheet').innerHTML=sheetHTML(BY.get(S.open));$('#sheet [data-act="close"]').focus();toast('Saved. The interview plan was rebuilt around your decision.')},
deep,cell:v=>{S.sel=v.split('-').map(Number);sched(v)},noshow:()=>{noShow(...S.sel);S.sel=null;sched();renderHero()},
drop:v=>{dropPanel(+v);sched();renderHero()},reset:()=>{resetDay();render()},
mg:v=>{S.mg=v;S.mi=0;render()},mi:v=>{const n=groups()[S.mg].length;S.mi=((S.mi+ +v)%n+n)%n;$('#mw').innerHTML=mailHTML(groups());$(`[data-key="${+v>0?'mnext':'mprev'}"]`).focus()},
rewrite,treset:()=>{S.tpl[S.mg]=JSON.parse(JSON.stringify(TPL0[S.mg]));render()},brief:aiBrief,plain:()=>{S.showPlain=true;render()},
xmail:()=>{const G=groups();save('drive-mail-merge.csv',[['Group','Name','Email','Subject','Body'],...EMAILG.flatMap(k=>G[k].map(it=>{const v=vars(it);return [GL[k],it.c.name,it.c.email,merge(S.tpl[k].subject,v),merge(S.tpl[k].body,v)]}))])},
xtrack:()=>{const m=at();save('drive-tracker.csv',[['ID','Name','Email','Phone','Campus','Branch','CGPA','Backlogs','Test','Score','Status','Reason','Interview','Panel','Skills'],...S.rank.map(c=>{const a=m.get(c.id);return [c.id,c.name,c.email||'',c.phone||'',c.campus,c.branch,c.cgpa??'',c.backlogs,c.test??'Absent',c.score,ST[c.st][1],c.st==='out'?c.why.join('; '):c.flag,a?fmt12(SLOTS[a.s]):S.standby.includes(c.id)?'Standby':'',a?PANELS[a.p].name:'',c.skills.join('; ')]})])}};
function sched(k){$('#clk').textContent=fmt12(S.clock);$('#dc').innerHTML=dcounts();$('#gw').innerHTML=gridHTML();$('#sbar').innerHTML=slotbar();$('#log').innerHTML=logHTML();if(k){const e=$(`[data-act="cell"][data-v="${k}"]`);if(e)e.focus()}}
function IN(id,t){if(id.startsWith('w.')||id==='cut'||id==='minCg'){const v=+t.value;if(id.startsWith('w.'))S.w[id.slice(2)]=v;else S[id]=v;$('#o-'+id.replace('.','\\.')).textContent=id==='minCg'?v.toFixed(1):v;recompute()}
else if(id==='bl'){S.bl=t.checked;recompute()}else if(id==='blind'){S.blind=t.checked;$('#res').innerHTML=resHTML()}
else if(id==='clock'){S.clock=+t.value;sched()}else if(id==='tsub'||id==='tbody'){S.tpl[S.mg][id==='tsub'?'subject':'body']=t.value;const G=groups();$('#mw').innerHTML=mailHTML(G)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled&&ACT[b.dataset.act])ACT[b.dataset.act](b.dataset.v,b)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.in&&t.type!=='checkbox')IN(t.dataset.in,t)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.in&&t.type==='checkbox')IN(t.dataset.in,t)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('#scrim').addEventListener('click',closeSheet);
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{if(load(String(r.result),f.name))doRun()};r.onerror=()=>toast("Couldn't read that file. Try saving it again as CSV.");r.readAsText(f);e.target.value=''});
load(SAMPLE,'sample');render();
(async()=>{if(!window.claude||!window.claude.use)return;const [sm,dl]=await Promise.all([window.claude.use('sample').catch(()=>null),window.claude.use('downloads').catch(()=>null)]);S.sample=sm;S.dl=dl;if(S.ran&&(sm||dl)&&!document.activeElement.matches('input,textarea,select'))render()})();
</script>
</body>
</html>
